/* ---------------------------------------------------------------- tokens */
:root{
  --void:#06121f; --navy:#142a4b; --navy-2:#0e2340; --amber:#e8a25b; --rose:#c96f5e;
  --mint:#7bdeca; --beacon:#ffe9c4; --sand:#c9a97c;
  --ink:#eaf2f6; --ink-dim:rgba(234,242,246,.62); --ink-faint:rgba(234,242,246,.38);
  --panel-w:430px;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.22,.61,.20,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
html,body{height:100%;overflow:hidden;background:#04101c;}
body{font-family:'Readex Pro',system-ui,sans-serif;color:var(--ink);}
#app{position:fixed;inset:0;}
#app canvas{display:block;}
.lbl-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}

/* boot veil */
#boot{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 90% at 50% 62%,#0d2340 0%,#06121f 62%,#040d17 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  transition:opacity 1s var(--ease),visibility 1s;}
body.ready #boot{opacity:0;visibility:hidden;}
#boot .bw{font-size:11px;letter-spacing:.52em;color:var(--mint);opacity:.85;}
#boot .bl{width:150px;height:1px;background:rgba(123,222,202,.2);position:relative;overflow:hidden;}
#boot .bl::after{content:'';position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--mint),transparent);
  animation:sweep 1.5s linear infinite;}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
#boot .bn{font-size:12px;color:var(--ink-faint);letter-spacing:.18em;}

/* ------------------------------------------------------------ title lockup */
#titleLockup{position:fixed;left:0;right:0;top:7.4vh;z-index:12;text-align:center;pointer-events:none;
  opacity:0;transform:translateY(14px);transition:opacity 1.5s var(--ease),transform 1.9s var(--ease);}
#titleLockup.in{opacity:1;transform:none;}
body.panel-open #titleLockup,body.engaged #titleLockup{opacity:0;transform:translateY(-10px);transition-duration:.9s;}
#titleLockup .ar{font-weight:700;font-size:clamp(30px,3.5vw,58px);line-height:1.28;
  color:#fff6e6;text-shadow:0 0 42px rgba(232,162,91,.42),0 2px 30px rgba(0,0,0,.55);}
#titleLockup .rule{width:92px;height:1px;margin:16px auto 14px;
  background:linear-gradient(90deg,transparent,rgba(123,222,202,.85),transparent);}
#titleLockup .en{font-size:clamp(10px,.85vw,14px);letter-spacing:.46em;text-transform:uppercase;
  color:rgba(234,242,246,.80);text-shadow:0 2px 18px rgba(0,0,0,.7);padding-left:.46em;}

/* hint */
#hint{position:fixed;left:0;right:0;bottom:5.6vh;z-index:12;text-align:center;pointer-events:none;
  font-size:12px;letter-spacing:.15em;color:var(--ink-dim);opacity:0;transform:translateY(8px);
  transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);}
#hint.in{opacity:1;transform:none;}
#hint.fade{opacity:0!important;}
#hint b{font-weight:400;color:var(--mint);}

/* tag + legend */
#tag{position:fixed;left:30px;bottom:26px;z-index:12;pointer-events:none;
  font-size:10.5px;color:var(--ink-faint);}
#tag .m{color:var(--mint);opacity:.9;}
#legend{position:fixed;right:30px;bottom:26px;z-index:12;pointer-events:none;
  display:flex;flex-direction:column;gap:9px;align-items:flex-end;
  opacity:0;transition:opacity 1.4s var(--ease);}
#legend.in{opacity:1;}
body.panel-open #legend{opacity:0;}
#legend div{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--ink-faint);}
#legend i{width:7px;height:7px;border-radius:50%;display:block;}
#legend .lit i{background:var(--beacon);box-shadow:0 0 12px 3px rgba(255,196,120,.65);}
#legend .wait i{background:var(--mint);box-shadow:0 0 9px 1px rgba(123,222,202,.45);opacity:.8;}

/* ------------------------------------------------------------- city labels */
.city-label{pointer-events:none;will-change:transform;}
.city-label .cl-in{transform:scale(var(--s,1));transform-origin:50% 100%;
  opacity:var(--o,1);text-align:center;padding-bottom:8px;
  transition:opacity .4s var(--ease),filter .35s var(--ease);}
.city-label .cl-ar{font-weight:700;font-size:16px;line-height:1.5;color:rgba(240,248,250,.92);
  text-shadow:0 1px 12px rgba(0,4,12,.95),0 0 24px rgba(0,10,20,.8);}
.city-label .cl-en{font-size:10px;letter-spacing:.24em;text-transform:uppercase;padding-left:.24em;
  color:rgba(150,232,214,.88);margin-top:2px;text-shadow:0 1px 10px rgba(0,4,12,.95);}
.city-label .cl-prop{font-size:9.5px;letter-spacing:.04em;color:rgba(234,242,246,.0);
  margin-top:4px;max-width:190px;transition:color .4s var(--ease);}
.city-label .cl-stem{width:1px;height:14px;margin:6px auto 0;
  background:linear-gradient(180deg,rgba(123,222,202,.45),transparent);}
.city-label.is-lit .cl-ar{font-size:19px;color:#fff3df;text-shadow:0 0 26px rgba(255,196,120,.55),0 1px 12px rgba(0,4,12,.95);}
.city-label.is-lit .cl-en{color:rgba(255,225,182,.92);font-size:10px;}
.city-label.is-lit .cl-stem{background:linear-gradient(180deg,rgba(255,206,145,.6),transparent);height:22px;}
.city-label .cl-badge{display:inline-block;font-size:8px;letter-spacing:.24em;padding:3px 8px 2px;
  border:1px solid rgba(255,206,145,.42);border-radius:999px;color:rgba(255,225,182,.9);
  margin-bottom:7px;background:rgba(20,42,75,.45);}
.city-label.hover .cl-ar{color:#fff;}
.city-label.hover .cl-prop{color:rgba(234,242,246,.72);}
.city-label.hover .cl-in{filter:drop-shadow(0 0 14px rgba(123,222,202,.35));}
.city-label.muted .cl-in{opacity:.12;}

/* ------------------------------------------------------------------ scrim */
#scrim{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;
  background:radial-gradient(120% 100% at 22% 50%,transparent 30%,rgba(4,12,22,.42) 100%);
  transition:opacity .7s var(--ease);}
body.panel-open #scrim{opacity:1;pointer-events:auto;}

/* ------------------------------------------------------------------ panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:20;
  background:linear-gradient(180deg,rgba(21,45,79,.955) 0%,rgba(16,35,62,.965) 52%,rgba(11,26,47,.975) 100%);
  backdrop-filter:blur(22px) saturate(115%);-webkit-backdrop-filter:blur(22px) saturate(115%);
  border-left:1px solid rgba(123,222,202,.20);
  box-shadow:-40px 0 90px -30px rgba(2,8,16,.75),inset 1px 0 0 rgba(255,255,255,.05);
  transform:translateX(102%);transition:transform .78s var(--ease);}
body.panel-open #panel{transform:none;}
#panel::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(123,222,202,.55),rgba(232,162,91,.35),transparent);}
.p-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:52px 34px 40px;}
.p-scroll::-webkit-scrollbar{width:4px;}
.p-scroll::-webkit-scrollbar-thumb{background:rgba(123,222,202,.22);border-radius:2px;}
.p-close{position:absolute;top:18px;right:18px;z-index:3;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(234,242,246,.16);background:rgba(255,255,255,.04);color:var(--ink-dim);
  font-size:17px;line-height:1;cursor:pointer;font-family:inherit;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);}
.p-close:hover{background:rgba(123,222,202,.14);color:#fff;border-color:rgba(123,222,202,.45);}
/* one kicker spec for every small label in the product: 9.5px, .26em tracking,
   uppercase, and a padding-left equal to the tracking so centred and
   left-aligned kickers are optically aligned instead of pushed right. */
.p-kicker,.p-fig figcaption,.p-plate-cap,.p-meta span,#legend div,#tag,.p-back,#toast{
  letter-spacing:.26em;text-transform:uppercase;padding-left:.26em;}
.p-kicker{font-size:9.5px;color:var(--mint);opacity:.9;}
.p-ar{font-weight:700;font-size:38px;line-height:1.34;margin-top:14px;color:#fff6e8;
  text-align:left;text-shadow:0 0 34px rgba(232,162,91,.20);}
#panel.waiting .p-ar{font-size:33px;color:#eef7f5;text-shadow:0 0 30px rgba(123,222,202,.16);}
.p-en{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(234,242,246,.66);
  margin-top:8px;padding-left:.34em;}
.p-rule{height:1px;margin:22px 0 20px;background:linear-gradient(90deg,rgba(123,222,202,.8),rgba(123,222,202,.06) 70%,transparent);}
.p-rule.warm{background:linear-gradient(90deg,rgba(255,206,145,.85),rgba(232,162,91,.10) 70%,transparent);}
.p-prop{font-size:19.5px;line-height:1.52;color:#f2f7f9;font-weight:400;letter-spacing:-.005em;}
.p-prop-ar{font-size:14px;line-height:1.8;color:rgba(234,242,246,.50);margin-top:9px;text-align:left;}
.p-figs{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
.p-fig{position:relative;border-radius:var(--r-lg);overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(2,8,16,.9),inset 0 0 0 1px rgba(255,255,255,.07);}
.p-fig img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;}
.p-fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 9px 14px;
  font-size:9px;color:rgba(255,255,255,.80);
  background:linear-gradient(180deg,transparent,rgba(6,18,31,.82));}
.p-story{margin-top:24px;font-size:14.5px;line-height:1.78;color:rgba(234,242,246,.74);
  padding-left:15px;border-left:1px solid rgba(232,162,91,.42);}
.p-soon{margin-top:30px;font-size:17px;line-height:1.6;color:#eef7f5;}
.p-soon-ar{margin-top:8px;font-size:14px;line-height:1.8;color:rgba(234,242,246,.50);text-align:left;}
.p-plate{position:relative;margin-top:28px;border-radius:var(--r-lg);overflow:hidden;
  aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(58% 76% at 50% 54%,rgba(123,222,202,.20) 0%,rgba(123,222,202,.05) 42%,transparent 72%),
    linear-gradient(160deg,#12304f 0%,#0b1e38 60%,#08182c 100%);
  box-shadow:inset 0 0 0 1px rgba(123,222,202,.16),0 18px 40px -22px rgba(2,8,16,.9);}
.p-plate-ar{font-weight:700;font-size:44px;line-height:1;color:rgba(234,242,246,.10);
  text-align:center;letter-spacing:0;user-select:none;}
.p-plate-em{position:absolute;left:50%;top:54%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:var(--mint);
  box-shadow:0 0 0 1px rgba(123,222,202,.5),0 0 22px 7px rgba(123,222,202,.45);
  animation:emb 3.4s ease-in-out infinite;}
@keyframes emb{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.18)}}
.p-plate-cap{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px 14px;
  font-size:9px;color:rgba(123,222,202,.75);
  background:linear-gradient(180deg,transparent,rgba(6,18,31,.7));}
.p-note{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
  font-size:11.5px;letter-spacing:.06em;color:var(--ink-faint);}
.p-meta{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.07);
  border-radius:var(--r-md);overflow:hidden;}
.p-meta>div{background:rgba(9,22,40,.62);padding:14px 15px;}
.p-meta span{display:block;font-size:8.5px;color:var(--ink-faint);}
.p-meta b{display:block;margin-top:6px;font-size:12.5px;font-weight:400;color:rgba(234,242,246,.86);}
.p-meta b.live{color:var(--beacon);}
.p-cta{display:block;width:100%;height:50px;margin-top:28px;border:0;border-radius:var(--r-md);
  background:linear-gradient(180deg,#8fe8d6,#63cdb8);color:#08202c;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.10em;
  box-shadow:0 14px 30px -14px rgba(123,222,202,.6);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease),filter .3s var(--ease);}
.p-cta:hover{transform:translateY(-2px);box-shadow:0 20px 38px -14px rgba(123,222,202,.75);filter:brightness(1.06);}
.p-cta.ghost{background:transparent;border:1px solid rgba(123,222,202,.45);color:var(--mint);
  box-shadow:none;font-weight:400;}
.p-cta.ghost:hover{background:rgba(123,222,202,.10);box-shadow:none;}
.p-back{display:block;margin-top:22px;text-align:center;font-size:10px;
  color:var(--ink-faint);text-decoration:none;transition:color .3s var(--ease);}
.p-back:hover{color:var(--mint);}

/* toast — same chrome vocabulary as the legend and the panel rules: glass,
   a hairline mint border, a mint status dot, and the shared kicker spec */
#toast{position:fixed;right:calc(var(--panel-w) / 2);bottom:56px;transform:translate(50%,14px);z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:11px 20px 10px;border-radius:999px;
  background:linear-gradient(180deg,rgba(21,45,79,.95),rgba(11,26,47,.96));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(123,222,202,.30);color:var(--mint);font-size:9.5px;
  opacity:0;pointer-events:none;transition:opacity .45s var(--ease),transform .45s var(--ease);
  box-shadow:0 16px 34px -16px rgba(2,8,16,.85),inset 0 1px 0 rgba(255,255,255,.05);}
#toast::before{content:'';width:6px;height:6px;border-radius:50%;flex:0 0 auto;
  background:var(--mint);box-shadow:0 0 10px 2px rgba(123,222,202,.55);}
#toast.show{opacity:1;transform:translate(50%,0);}

@media (max-width:900px){:root{--panel-w:min(400px,88vw);} .p-ar{font-size:31px;}}
</style>
